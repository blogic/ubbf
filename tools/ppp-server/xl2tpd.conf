; xl2tpd configuration for L2TP server
; Placeholders replaced by l2tp-server.sh at runtime:
;   __LISTEN_IF__        - interface to listen on
;   __PPP_LOCAL_IP__     - local PPP IP
;   __PPP_REMOTE_START__ - start of remote IP range
;   __PPP_REMOTE_END__   - end of remote IP range
;   __PPP_OPTIONS__      - path to ppp options file

[global]
listen-addr = __LISTEN_ADDR__
port = 1701

[lns default]
ip range = __PPP_REMOTE_START__ - __PPP_REMOTE_END__
local ip = __PPP_LOCAL_IP__
require chap = yes
refuse pap = yes
require authentication = yes
pppoptfile = __PPP_OPTIONS__
length bit = yes
