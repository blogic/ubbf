#!/usr/sbin/nft -f
# nftables rules for PPP server masquerading
# Placeholders are replaced by ppp-server.sh at runtime:
#   __UPSTREAM_IF__ - upstream interface for masquerade
#   __PPP_SUBNET__  - PPP IPv4 subnet (e.g., 10.99.0.0/24)
#   __IPV6_NET__    - PPP IPv6 network (e.g., fd00:0:0:99::)

table inet ppp_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr __PPP_SUBNET__ oifname "__UPSTREAM_IF__" masquerade
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        iifname "ppp*" oifname "__UPSTREAM_IF__" accept
        iifname "__UPSTREAM_IF__" oifname "ppp*" ct state established,related accept
        ip6 saddr & ffff:ffff:ffff:ffff:: == __IPV6_NET__ oifname "__UPSTREAM_IF__" accept
        ip6 daddr & ffff:ffff:ffff:ffff:: == __IPV6_NET__ iifname "__UPSTREAM_IF__" accept
    }
}
